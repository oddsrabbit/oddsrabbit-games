<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rabbit Pets harness</title>
<style>html,body{margin:0;height:100%;background:#000}iframe{border:0;width:100%;height:100%;display:block}</style>
</head><body>
<iframe id="g" src="../dist/rabbit-pets/index.html"></iframe>
<script>
// Local stand-in for the OddsRabbit host: answers the bridge from memory so the
// game can be run without the platform. Not shipped; see ../README.md.
//   npm run build
//   python3 -m http.server 8765   (any static server at the repo root)
//   open http://localhost:8765/rabbit-pets/dev/harness.html?seed=day&at=14
// It lives outside dist/ so rebuilding never deletes it.
// Params:
//   seed=day|away|night-cushion   pre-save a pet
//   at=HH                         shift the clock so local time is HH:30
//   user=0                        signed out
//   coat=cocoa                    coat for the seeded pet
//   ask=1                         reminders never asked, no timers running
//   date=2026-12-20               shift the clock to that date (seasons, weather, events)
//   extras=1                      seeded pet also has a garden, finds, outfits, a marking, a journal
//   friends=0                     no social verbs (hides Friends and gifts)
//   inbox=0                       no gift waiting from a friend
//   click=Feed,Pet                press buttons in order after load
//   drag=x1,y1,x2,y2              then drag on the burrow, in scene pixels
const q = new URLSearchParams(location.search);
const store = {};
let offset = 0;
if (q.get('at')) { const d = new Date(); const want = Number(q.get('at')); offset = ((want - d.getHours() + 24) % 24) * 3600e3 + (30 - d.getMinutes()) * 60e3; }
if (q.get('date')) { const [y, m, dd] = q.get('date').split('-').map(Number); const t = new Date(Date.now() + offset); offset += new Date(y, m - 1, dd, t.getHours(), t.getMinutes()).getTime() - t.getTime(); }
const now = () => Date.now() + offset;
const seed = q.get('seed');
if (seed) {
  const t = now();
  const gap = seed === 'away' ? 7 * 3600e3 + 12 * 60e3 : 10 * 60e3;
  store['v1:pet'] = JSON.stringify({
    v: 1, petId: 'harness', name: 'Clover', coat: q.get('coat') || 'snow', bornAtMs: t - 5 * 864e5,
    simAtMs: t - gap - ((t - gap) % 600000), stepIndex: 900, rev: 3,
    needs: seed === 'away' ? { hunger: 58, happy: 50, energy: 60, clean: 70 } : { hunger: 64, happy: 76, energy: 52, clean: 58 },
    bond: 24, bondToday: 2, bondDay: '2000-01-01', daysVisited: 5, lastVisitDay: '2000-01-01',
    timers: seed === 'away' ? [{ kind: 'bake', startedAtMs: t - gap, endsAtMs: t - gap + 3600e3 }] : [{ kind: 'bake', startedAtMs: t - 18 * 60e3, endsAtMs: t + 42 * 60e3 }],
    treats: 1, clover: 128, gift: { lastClaimDay: null, streak: 4 }, visitorsClaimed: [],
  });
  store['v1:burrow'] = JSON.stringify({ v: 1, rev: 2, items: [
    { uid: 'a', id: 'cushion', slot: 'b2' }, { uid: 'b', id: 'plant', slot: 'b1' }, { uid: 'c', id: 'rug', slot: 'r1' },
    { uid: 'd', id: 'lantern', slot: 'h2' }, { uid: 'e', id: 'jar', slot: 'f3' },
  ] });
  store['v1:settings'] = JSON.stringify({ v: 1, rev: 1, reminders: q.get('ask') ? null : 'on', scheduled: {} });
  if (q.get('ask')) { const p = JSON.parse(store['v1:pet']); p.timers = []; store['v1:pet'] = JSON.stringify(p); }
  if (q.get('extras')) {
    const p = JSON.parse(store['v1:pet']);
    Object.assign(p, {
      daysVisited: 9, careCounts: { fed: 20, pet: 31, clean: 12 }, marking: 'heart', meals: 20,
      collection: { pebble: 3, feather: 1, acorn: 2, marble: 1 },
      garden: { plots: [{ crop: 'berry', plantedAtMs: t - 9 * 3600e3, readyAtMs: t - 3600e3 }, { crop: 'golden', plantedAtMs: t - 5 * 3600e3, readyAtMs: t + 7 * 3600e3 }, null] },
      pantry: { berries: 1, golden: 1 },
      wardrobe: { owned: ['bow', 'bandana'], head: 'bow', neck: 'bandana' },
    });
    store['v1:pet'] = JSON.stringify(p);
    store['v1:journal'] = JSON.stringify({ v: 1, rev: 1, firsts: ['adopted', 'find:marble', 'marking'], entries: [
      { atMs: t - 2 * 864e5, text: 'Clover grew a heart, from all the cuddles.', art: 'sparkle' },
      { atMs: t - 3 * 864e5, text: 'Found a marble for the shelf. A rare one!', art: 'marble' },
      { atMs: t - 9 * 864e5, text: 'Clover came home to the burrow.', art: 'heart' },
    ] });
  }
}
// two friends with rabbits, and a gift waiting
const FRIENDS = [
  { uuid: '22222222-2222-4222-8222-222222222222', username: 'pip_fan', avatar: null, updatedAt: new Date().toISOString(),
    data: { v: 1, name: 'Pip', coat: 'ginger', needs: { hunger: 70, happy: 80, energy: 60, clean: 75 }, simAtMs: now(), napEndsAtMs: null, vacationUntilMs: null,
      daysVisited: 23, bondLevel: 4, trait: 'playful', head: 'flowercrown', neck: null, marking: 'freckles',
      items: [{ id: 'rug', x: 49, y: 106, flip: false }, { id: 'mushroom', x: 20, y: 104, flip: false }, { id: 'garland', x: 50, y: 12, flip: false }, { id: 'jar', x: 80, y: 110, flip: true }] } },
  { uuid: '33333333-3333-4333-8333-333333333333', username: 'mochi.mama', avatar: null, updatedAt: new Date().toISOString(),
    data: { v: 1, name: 'Mochi', coat: 'midnight', needs: { hunger: 50, happy: 60, energy: 40, clean: 80 }, simAtMs: now(), napEndsAtMs: null, vacationUntilMs: null,
      daysVisited: 4, bondLevel: 1, trait: 'shy', head: 'beanie', neck: 'redscarf', marking: null,
      items: [{ id: 'cushion', x: 70, y: 108, flip: false }, { id: 'lantern', x: 30, y: 14, flip: false }] } },
];
const inbox = q.get('inbox') === '0' ? [] : [{ giftUuid: '44444444-4444-4444-8444-444444444444', from: { uuid: FRIENDS[0].uuid, username: 'pip_fan', avatar: null }, kind: 'berry', message: null, sentAt: new Date().toISOString() }];
const sentToday = [];
const frame = document.getElementById('g');
const caps = ['storage.get','storage.set','storage.delete','content.daily','actions.share','actions.haptic','actions.requestSignIn','session.refresh','time.now','notifications.schedule','notifications.cancel','notifications.list','notifications.status'];
if (q.get('friends') !== '0') caps.push('showcase.publish', 'showcase.friends', 'showcase.get', 'gifts.send', 'gifts.inbox', 'gifts.claim', 'gifts.sentToday');
function send(msg) { frame.contentWindow.postMessage(msg, '*'); }
function init() {
  send({ type: 'init', user: q.get('user') === '0' ? null : { uuid: '11111111-1111-4111-8111-111111111111', username: 'tester', avatar: null, createdAt: null },
    sessionToken: 'x', expiresAt: null, colorScheme: 'light', capabilities: caps });
}
frame.addEventListener('load', () => {
  init(); setTimeout(init, 200);
  // click=Text1,Text2: press buttons whose text contains each, in order
  const clicks = (q.get('click') || '').split(',').filter(Boolean);
  // drag=x1,y1,x2,y2 in scene pixels: drag on the burrow canvas after the clicks
  const drag = (q.get('drag') || '').split(',').map(Number);
  if (drag.length === 4) setTimeout(() => {
    const cv = frame.contentDocument.querySelector('canvas');
    const r = cv.getBoundingClientRect(), k = r.width / 98;
    const at = (x, y) => ({ clientX: r.left + x * k, clientY: r.top + y * k, pointerId: 1, bubbles: true });
    cv.dispatchEvent(new frame.contentWindow.PointerEvent('pointerdown', at(drag[0], drag[1])));
    for (let t = 1; t <= 5; t++) cv.dispatchEvent(new frame.contentWindow.PointerEvent('pointermove', at(drag[0] + (drag[2] - drag[0]) * t / 5, drag[1] + (drag[3] - drag[1]) * t / 5)));
    cv.dispatchEvent(new frame.contentWindow.PointerEvent('pointerup', at(drag[2], drag[3])));
  }, 1500 + clicks.length * 700);
  clicks.forEach((text, i) => setTimeout(() => {
    const doc = frame.contentDocument;
    const b = [...doc.querySelectorAll('button')].find((x) => (x.textContent || '').includes(text) || (x.getAttribute('aria-label') || '').includes(text));
    if (b) b.click(); else console.log('no button', text);
  }, 1500 + i * 700));
});
window.addEventListener('message', (e) => {
  const r = e.data; if (!r || !r.correlationId) return;
  const ok = (result) => send({ type: 'response', correlationId: r.correlationId, ok: true, result });
  const p = r.payload || {};
  switch (r.type) {
    case 'storage.get': return ok(store[p.key] ?? null);
    case 'storage.set': store[p.key] = p.value; return ok(undefined);
    case 'storage.delete': delete store[p.key]; return ok(undefined);
    case 'time.now': return ok({ serverTime: new Date(now()).toISOString() });
    case 'content.daily': return ok({ roundKey: p.roundKey, content: { visitor: 'hedgehog', line: 'Brought you a dandelion!' } });
    case 'notifications.schedule': console.log('schedule', p.key, p.fireAt, p.body); return ok({ key: p.key, fireAt: p.fireAt.replace(/\.\d+Z$/, 'Z'), deliverAt: p.fireAt.replace(/\.\d+Z$/, 'Z'), serverTime: new Date(now()).toISOString() });
    case 'notifications.cancel': return ok({ key: p.key, cancelled: true });
    case 'notifications.list': return ok({ pending: [], serverTime: new Date(now()).toISOString() });
    case 'notifications.status': return ok({ push: true });
    case 'showcase.publish': console.log('showcase', JSON.stringify(p.data).length, 'bytes', p.data); return ok({ updatedAt: new Date(now()).toISOString() });
    case 'showcase.friends': return ok(FRIENDS);
    case 'showcase.get': return ok(FRIENDS.find((f) => f.uuid === p.userUuid) ?? null);
    case 'gifts.inbox': return ok(inbox);
    case 'gifts.claim': { const i = inbox.findIndex((g) => g.giftUuid === p.giftUuid); if (i < 0) return send({ type: 'response', correlationId: r.correlationId, ok: false, error: { code: 'gifts/claimed', message: 'claimed' } }); const [g] = inbox.splice(i, 1); return ok({ giftUuid: g.giftUuid, kind: g.kind, claimedAt: new Date(now()).toISOString() }); }
    case 'gifts.send': if (sentToday.includes(p.toUserUuid)) return send({ type: 'response', correlationId: r.correlationId, ok: false, error: { code: 'gifts/already-sent-today', message: 'already' } }); sentToday.push(p.toUserUuid); return ok({ giftUuid: '55555555-5555-4555-8555-' + String(Date.now()).slice(-12).padStart(12, '0'), sentAt: new Date(now()).toISOString() });
    case 'gifts.sentToday': return ok(sentToday.slice());
    default: return ok(undefined);
  }
});
</script>
</body></html>
