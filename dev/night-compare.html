<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Night Lighting Live</title>
<style>
  body{margin:0;background:#241814;color:#fff6e4;font-family:system-ui,sans-serif;padding:16px}
  h1{font-size:18px;margin:0 0 4px} p{margin:0 0 16px;opacity:.75;font-size:14px}
  .row{display:flex;gap:20px;flex-wrap:wrap}
  figure{margin:0} figcaption{margin-top:8px;font-size:14px}
  iframe{width:380px;height:680px;border:0;border-radius:12px;background:#000}
</style></head><body>
<h1>Night lighting, live</h1>
<p>Each panel is the real game running in the local harness (http://127.0.0.1:8777). Change the query to try other coats (coat=snow|cream|cocoa|silver|midnight|ginger) or rich=1 for decorated rooms.</p>
<div class="row">
  <figure><iframe src="http://127.0.0.1:8777/dev/harness.html?seed=day&visits=0&inbox=0&coat=cream&at=14"></iframe><figcaption>Day · 14:30</figcaption></figure>
  <figure><iframe src="http://127.0.0.1:8777/dev/harness.html?seed=day&visits=0&inbox=0&coat=cream&at=22"></iframe><figcaption>Night, awake · 22:30</figcaption></figure>
  <figure><iframe src="http://127.0.0.1:8777/dev/harness.html?seed=day&visits=0&inbox=0&coat=midnight&rich=1&at=22"></iframe><figcaption>Night, decorated room · 22:30</figcaption></figure>
  <figure><iframe src="http://127.0.0.1:8777/dev/harness.html?seed=day&visits=0&inbox=0&coat=snow&nap=1&at=22"></iframe><figcaption>Night, asleep · 22:30</figcaption></figure>
</div>
</body></html>
