<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rabbit Sudoku harness</title>
<style>html,body{margin:0;height:100%;background:#000}iframe{border:0;width:100%;height:100%;display:block}</style>
</head><body>
<iframe id="g"></iframe>
<script>
// Local stand-in for the OddsRabbit host: answers the bridge from memory so the
// game runs without the platform. Not shipped.
//   (cd .. && npm run build) && npm run build && npm run serve
//   open http://localhost:8770/dev/harness.html
// Params:
//   day=N        play puzzle-N (default 7, a Monday). Moves the server clock (time.now) to that day.
//   user=0       signed out: home asks you to sign in
//   fresh=1      forget saved progress (help shows again)
//   friends=0    no friends have played today's Daily
//   others=N     how many strangers solved each day (default 14), for the Everyone board
//   sendfail=N   the first N Daily submissions fail as if offline
//   chrome=app   fake the app's edge insets (status bar, chrome row, home indicator)
//   help=0       skip the first-run help
//   open=1       open straight into the puzzle, for screenshots
//   archive=N    open as the archive page's Play button does: initialState for puzzle-N
//   past=1       open the Past puzzles list from home, for screenshots
//   scheme=dark  the app is in dark mode (what "Match app" follows)
//   theme=T      start with the Colours setting on T: auto, light, paper or dark
//   select=N     with open=1, tap cell N (0-80) once the puzzle is up
const q = new URLSearchParams(location.search);
const STORE_KEY = 'rs-harness-store';
if (q.get('fresh')) localStorage.removeItem(STORE_KEY);
const store = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
if (q.get('help') === '0') store.seen_help = 'true';
if (q.has('theme')) store.settings = JSON.stringify({ ...JSON.parse(store.settings || '{}'), theme: q.get('theme') });
const persist = () => localStorage.setItem(STORE_KEY, JSON.stringify(store));
const frame = document.getElementById('g');
frame.src = '../dist/rabbit-sudoku/index.html';

// EPOCH in src/puzzle.ts.
const EPOCH_MS = Date.UTC(2026, 10, 9);
const DAY = 86400000;
const TODAY = Number(q.get('day') ?? 7);
const startReal = Date.now();
const serverNow = () => EPOCH_MS + TODAY * DAY + Math.min(startReal % DAY, DAY - 3600e3) + (Date.now() - startReal);

let days = [];
const ready = fetch('../data/rabbit-sudoku-puzzles.json').then((r) => r.json()).then((d) => { days = d.days; });

const ME = { uuid: '11111111-1111-4111-8111-111111111111', username: 'tester', avatar: null, createdAt: null };
const FRIENDS = ['pip_fan', 'mochi.mama', 'bun.bun', 'maple_leaf', 'thumper'].map((username, i) => ({
  uuid: `2222222${i}-2222-4222-8222-222222222222`, username, avatar: null,
}));
const OTHERS = Array.from({ length: Number(q.get('others') ?? 14) }, (_, i) => ({
  uuid: `33333333-3333-4333-8333-${String(i).padStart(12, '0')}`, username: `solver_${i + 1}`, avatar: null,
}));
// FNV-1a, then a murmur3 finish: without it, seeds differing only at the end (race-5, race-6) land close together.
const rnd = (s) => {
  let h = 2166136261;
  for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
};
const mine = {}; // roundKey → my row

const caps = ['storage.get', 'storage.set', 'storage.delete', 'content.daily', 'actions.share', 'actions.haptic',
  'actions.requestSignIn', 'scores.submit', 'scores.friends', 'scores.top', 'scores.rank', 'scores.distribution', 'time.now'];
const signedIn = q.get('user') !== '0';

/**
 * Everyone who played a day, as the server orders it: score down, then who got
 * on first. A solve is 100 less its hints; about one in four is still at it (0).
 * On `race-N` (the opt-in race), about half raced: 86400 less their seconds,
 * 4 to 40 minutes, and a few started without finishing (0).
 */
function field(roundKey) {
  const day = Date.parse('2026-11-09T00:00:00Z');
  const friends = q.get('friends') === '0' ? [] : FRIENDS.filter((f) => rnd(f.username + roundKey) < 0.55);
  const race = roundKey.startsWith('race-');
  // Friends race more often than strangers, so the race tab's friends line has something to show.
  const players = race ? [...friends, ...OTHERS].filter((u) => rnd('r' + u.username + roundKey) < (friends.includes(u) ? 0.9 : 0.5)) : [...friends, ...OTHERS];
  const rows = players.map((u) => {
    if (race) {
      const finished = rnd('f' + u.username + roundKey) > 0.15;
      const seconds = Math.round(240 + rnd('t' + u.uuid + roundKey) * 2160);
      return {
        ...u, score: finished ? 86400 - seconds : 0, metadata: finished ? { finished, seconds } : { finished },
        createdAt: new Date(day + rnd(u.username + roundKey) * 8 * 3600e3).toISOString(),
      };
    }
    const hints = Math.floor(rnd(u.uuid + roundKey) * 4);
    const solved = rnd('s' + u.username + roundKey) > 0.25;
    return {
      ...u, score: solved ? 100 - hints : 0, metadata: { solved, hints },
      createdAt: new Date(day + rnd(u.username + roundKey) * 8 * 3600e3).toISOString(),
    };
  });
  if (mine[roundKey]) rows.push(mine[roundKey]);
  rows.sort((a, b) => b.score - a.score || Date.parse(a.createdAt) - Date.parse(b.createdAt));
  return rows.map(({ isSelf, ...r }) => r);
}
function send(msg) { frame.contentWindow.postMessage(msg, '*'); }
function init() {
  send({ type: 'init', user: signedIn ? ME : null, sessionToken: signedIn ? 'x' : null, expiresAt: null, colorScheme: q.get('scheme') === 'dark' ? 'dark' : 'light', capabilities: caps,
    ...(q.has('archive') ? { initialState: { target: 'play', roundKey: `puzzle-${q.get('archive')}` } } : {}) });
}
let initSent = false;
frame.addEventListener('load', () => {
  if (q.get('chrome') === 'app') {
    const s = frame.contentDocument.documentElement.style;
    s.setProperty('--oddsrabbit-safe-top', '47px'); s.setProperty('--oddsrabbit-chrome-height', '56px');
    s.setProperty('--oddsrabbit-chrome-start', '56px'); s.setProperty('--oddsrabbit-safe-bottom', '34px');
  }
  if (initSent) return;
  initSent = true;
  init(); setTimeout(init, 200);
  const open = q.get('open');
  let tries = 0;
  const tryOpen = () => {
    const doc = frame.contentDocument;
    const target = doc.querySelector('.spotlight .primary');
    if (target) {
      target.click();
      if (q.has('select')) setTimeout(() => doc.querySelectorAll('.cell')[Number(q.get('select'))]?.click(), 100);
    } else if (tries++ < 30) setTimeout(tryOpen, 200);
  };
  if (open) setTimeout(tryOpen, 300);
  const tryPast = () => {
    const entry = frame.contentDocument.querySelector('.past-link');
    if (entry) entry.click();
    else if (tries++ < 30) setTimeout(tryPast, 200);
  };
  if (q.get('past')) setTimeout(tryPast, 300);
});
let sendFails = Number(q.get('sendfail') || 0);

window.addEventListener('message', async (e) => {
  const r = e.data; if (!r || !r.correlationId) return;
  const ok = (result) => send({ type: 'response', correlationId: r.correlationId, ok: true, result });
  const fail = (code) => send({ type: 'response', correlationId: r.correlationId, ok: false, error: { code, message: code } });
  const p = r.payload || {};
  switch (r.type) {
    // Guests keep storage in this browser, as the real host does.
    case 'storage.get': await ready; return ok(store[p.key] ?? null);
    case 'storage.set': store[p.key] = p.value; persist(); return ok(undefined);
    case 'storage.delete': delete store[p.key]; persist(); return ok(undefined);
    case 'time.now': return ok({ serverTime: new Date(serverNow()).toISOString() });
    case 'content.daily': {
      await ready;
      const m = /^puzzle-(\d+)$/.exec(p.roundKey);
      const n = m ? Number(m[1]) : -1;
      return ok(n >= 0 && n <= TODAY && days[n] ? { roundKey: p.roundKey, content: days[n] } : null);
    }
    case 'scores.submit': {
      if (!signedIn) return fail('scores/unauthorized');
      console.log('submit', p.roundKey, p.score, JSON.stringify(p.metadata));
      if (sendFails > 0) { sendFails--; return fail('network/offline'); }
      const had = mine[p.roundKey];
      if (had && !p.keepBest) return fail('scores/already-submitted');
      // As the server: a race can't start once the day was played without it.
      const race = /^race-(\d+)$/.exec(p.roundKey);
      if (race && p.score === 0 && !had && mine[`puzzle-${race[1]}`]) return fail('scores/race-unavailable');
      // keepBest: the higher score stays, with its metadata; created_at never moves.
      if (!had) mine[p.roundKey] = { ...ME, score: p.score, metadata: p.metadata ?? null, createdAt: new Date().toISOString(), isSelf: true };
      else if (p.score > had.score) Object.assign(had, { score: p.score, metadata: p.metadata ?? null });
      return ok({ submittedAt: new Date().toISOString() });
    }
    case 'scores.friends': {
      const mates = new Set(FRIENDS.map((f) => f.uuid));
      return ok(field(p.roundKey).filter((r) => mates.has(r.uuid) || r.uuid === ME.uuid).map((r) => ({ ...r, isSelf: r.uuid === ME.uuid })));
    }
    case 'scores.top': return ok(field(p.roundKey).slice(0, p.limit ?? 20));
    case 'scores.rank': {
      const l = field(p.roundKey); const i = l.findIndex((r) => r.uuid === ME.uuid);
      return ok(i < 0 ? null : { rank: l.filter((r) => r.score > l[i].score).length + 1, total: l.length, entry: { ...l[i], isSelf: true } });
    }
    case 'scores.distribution': {
      const counts = new Map();
      for (const r of field(p.roundKey)) counts.set(r.score, (counts.get(r.score) ?? 0) + 1);
      return ok([...counts].map(([score, count]) => ({ score, count })));
    }
    case 'actions.share': console.log('share\n' + p.text); return ok(undefined);
    case 'actions.requestSignIn': alert('The host would show its sign-in prompt here. Reload without user=0 to play signed in.'); return ok(undefined);
    default: return ok(undefined);
  }
});
</script>
</body></html>
