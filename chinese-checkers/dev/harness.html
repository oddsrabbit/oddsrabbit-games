<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chinese Checkers harness</title>
<style>html,body{margin:0;height:100%;background:#000}iframe{border:0;width:100%;height:100%;display:block}</style>
</head><body>
<iframe id="g" src="../dist/chinese-checkers/index.html"></iframe>
<script src="../js/rules.js"></script>
<script src="../js/bot.js"></script>
<script>
// Local stand-in for the OddsRabbit host: answers the matches bridge from
// memory so the game runs without the platform. Not shipped.
//   npm run build
//   python3 -m http.server 8765        (in chinese-checkers/)
//   open http://localhost:8765/dev/harness.html
// The referee is js/rules.js, standing in for ChineseCheckersRules.php, and
// the view is shaped like its viewFor. The other seats are played by the
// Steady computer, 1.5 s after the turn reaches them.
// Params:
//   user=0          signed out
//   matches=0       host without the matches verbs
//   delay=ms        answer every request this late (default 50)
//   games=0         start with no games (the first-run landing)
//   busy=1          add a 4-player game, a stalled game and a lobby
//   finished=1      add a finished game (result card, Moves, Rematch)
//   challenge=1     @hopper has challenged you to a game of three
//   open=n          open the nth game straight away
//   theme=dark      dark host theme
//   opp=none        the other seats never move
//   idle=days       every turn counts as having started this long ago
//   chat=0          host without matches.chat / matches.chatSend
//   fresh=1         forget saved computer games (kept in localStorage)
const q = new URLSearchParams(location.search);
const R = window.CCRules, Bot = window.CCBot;
const DELAY = Number(q.get('delay') || 50);
if (q.get('fresh') === '1') Object.keys(localStorage).filter((k) => k.startsWith('cc-harness:')).forEach((k) => localStorage.removeItem(k));
const ME = { uuid: '11111111-1111-4111-8111-111111111111', username: 'tester' };
const PEOPLE = [
  { uuid: '22222222-2222-4222-8222-222222222222', username: 'pip_fan', avatar: null, relation: 'mutual' },
  { uuid: '33333333-3333-4333-8333-333333333333', username: 'hopper', avatar: null, relation: 'following' },
  { uuid: '44444444-4444-4444-8444-444444444444', username: 'clover', avatar: null, relation: 'follower' },
];
const OTHERS = [
  { uuid: '66666666-6666-4666-8666-666666666666', username: 'rabbit_racer', avatar: null, relation: 'none' },
  { uuid: '77777777-7777-4777-8777-777777777777', username: 'radish_king', avatar: null, relation: 'none' },
];
const STRANGER = { uuid: '55555555-5555-4555-8555-555555555555', username: 'stranger_danger' };
const IDLE_MS = Number(q.get('idle') || 0) * 86400e3;
const matches = {};
const turnStart = () => new Date(Date.now() - IDLE_MS).toISOString();
let n = 0;
function uuid() { n++; return 'aaaaaaaa-aaaa-4aaa-8aaa-' + String(n).padStart(12, '0'); }

// A match. `mySeat` is the viewer's seat; `others` fill the rest in order.
function newMatch(others, opts = {}) {
  const seats = opts.seats || others.length + 1;
  const mySeat = opts.mySeat || 0;
  const people = others.slice();
  const players = [];
  for (let s = 0; s < seats; s++) {
    const p = s === mySeat ? ME : people.shift();
    if (p) players.push({ seat: s, uuid: p.uuid, username: p.username, avatar: null, status: 'joined', score: 0 });
  }
  const m = {
    uuid: uuid(), version: 1, status: players.length === seats ? 'active' : 'lobby', joinCode: null, matchmaking: false,
    seats, mySeat, updatedAt: new Date(Date.now() - (opts.ageMs || 0)).toISOString(), turnStartedAt: turnStart(),
    winner: null, chat: [], chatSeen: 0, history: [], lastMove: null,
    st: { seats, board: R.start(seats), moves: 0, last: null, winner: null },
    turn: opts.first || 0, players, lastBy: {},
  };
  matches[m.uuid] = m;
  return m;
}

const me = (m) => m.players.find((p) => p.uuid === ME.uuid);

function view(m) {
  const mine = me(m);
  const active = m.status === 'active';
  return {
    matchUuid: m.uuid, game: 'chinese-checkers', status: m.status, version: m.version, maxPlayers: m.seats,
    players: m.players.map((p) => ({ ...p, isSelf: p.uuid === ME.uuid })).sort((a, b) => a.seat - b.seat),
    turnSeat: active ? m.turn : null, turnDeadline: null, winnerSeat: m.winner,
    turnStartedAt: active ? m.turnStartedAt : null,
    mySeat: mine ? mine.seat : null, mySeatStatus: mine ? mine.status : null,
    isMyTurn: active && !!mine && m.turn === mine.seat && mine.status === 'joined',
    updatedAt: m.updatedAt, joinCode: m.joinCode,
    recap: m.st.last && m.st.last.path ? { hops: m.st.last.path.length - 1, jump: R.describe(m.st.last.path) !== 'a step' } : null,
    matchmaking: m.matchmaking, chatUnread: m.chat.length - m.chatSeen,
    view: { seats: m.seats, board: m.st.board, moves: m.st.moves, last: m.st.last, winner: m.st.winner, history: m.history },
    lastMove: m.lastMove,
  };
}

function record(m, seat, move) {
  m.lastMove = { ply: m.history.length, seat, move, scoreDelta: 0 };
  m.history.push(m.lastMove);
  m.version++;
  m.updatedAt = new Date().toISOString();
}

function activeSeats(m) { return m.players.filter((p) => p.status === 'joined').map((p) => p.seat); }

function nextTurn(m, from) {
  const act = activeSeats(m);
  for (let k = 1; k <= m.seats; k++) { const s = (from + k) % m.seats; if (act.includes(s)) return s; }
  return from;
}

function play(m, seat, move) {
  try { m.st = R.apply(m.st, seat, move); } catch (e) { throw { code: 'match/illegal-move', message: e.message }; }
  if (move.type === 'move') m.lastBy[seat] = { from: move.from, to: move.to };
  record(m, seat, move.type === 'move' ? { type: 'move', from: move.from, to: move.to } : { type: 'pass' });
  if (m.st.winner !== null) { m.status = 'finished'; m.winner = m.st.winner; return; }
  m.turn = nextTurn(m, seat);
  m.turnStartedAt = turnStart();
  othersMove(m);
}

// Whoever is on turn, if it isn't the viewer, moves in a moment.
function othersMove(m) {
  if (q.get('opp') === 'none') return;
  setTimeout(() => {
    const mine = me(m);
    if (m.status !== 'active' || (mine && m.turn === mine.seat)) return;
    const s = m.turn;
    const mv = Bot.choose(m.st.board, m.seats, s, 'normal', m.lastBy[s]);
    play(m, s, mv ? { type: 'move', from: mv.from, to: mv.to } : { type: 'pass' });
  }, 1500);
}

function autoplay(m, plies) {
  for (let i = 0; i < plies && m.status === 'active'; i++) {
    const s = m.turn;
    const mv = Bot.choose(m.st.board, m.seats, s, 'normal', m.lastBy[s]);
    m.st = R.apply(m.st, s, mv ? { type: 'move', from: mv.from, to: mv.to } : { type: 'pass' });
    if (mv) m.lastBy[s] = mv;
    record(m, s, mv ? { type: 'move', from: mv.from, to: mv.to } : { type: 'pass' });
    if (m.st.winner !== null) { m.status = 'finished'; m.winner = m.st.winner; return; }
    m.turn = nextTurn(m, s);
  }
}

function chatMessage(m, who, text) {
  const p = m.players.find((x) => x.uuid === who.uuid);
  const msg = {
    messageUuid: uuid(), seat: p ? p.seat : null, uuid: who.uuid, username: who.username, avatar: null,
    kind: 'text', text, sentAt: new Date().toISOString(), isSelf: who.uuid === ME.uuid, nonce: null,
  };
  m.chat.push(msg);
  return msg;
}
const REPLIES = ['nice ladder!', 'didn’t see that jump coming', 'gg so far', 'my marbles are coming for you', '👀'];

if (q.get('games') !== '0') {
  // Your move against @pip_fan, a few rounds in.
  const first = newMatch([PEOPLE[0]], { ageMs: 3 * 3600e3, first: 1 });
  autoplay(first, 9);
  chatMessage(first, PEOPLE[0], 'good luck, you’ll need it');
  // Their move: you, @hopper and @clover.
  const second = newMatch([PEOPLE[1], PEOPLE[2]], { ageMs: 2 * 86400e3, mySeat: 0 });
  autoplay(second, 4);
  if (second.turn === 0) autoplay(second, 1);
}
if (q.get('busy') === '1') {
  const a = newMatch([PEOPLE[0], PEOPLE[1], PEOPLE[2]], { ageMs: 20 * 60e3, mySeat: 2 });
  autoplay(a, 26);
  while (a.turn !== 2) autoplay(a, 1);
  const b = newMatch([PEOPLE[2]], { ageMs: 2 * 86400e3 });
  autoplay(b, 3);
  b.turnStartedAt = new Date(Date.now() - 2 * 86400e3).toISOString();
  const lobby = newMatch([], { seats: 3 });
  lobby.joinCode = 'HOPS42';
}
if (q.get('finished') === '1') {
  const f = newMatch([STRANGER], { ageMs: 9 * 86400e3 });
  autoplay(f, 400);
  f.updatedAt = new Date(Date.now() - 9 * 86400e3).toISOString();
}
if (q.get('challenge') === '1') {
  const c = newMatch([PEOPLE[1], PEOPLE[2]], { mySeat: 1 });
  c.status = 'lobby';
  me(c).status = 'invited';
}

const frame = document.getElementById('g');
const caps = ['storage.get', 'storage.set', 'actions.share', 'actions.haptic', 'actions.requestSignIn'];
if (q.get('info') !== '0') caps.push('actions.showGameInfo');
if (q.get('matches') !== '0') caps.push('matches.create', 'matches.join', 'matches.list', 'matches.get', 'matches.move', 'matches.resign', 'matches.invitable', 'matches.nudge', 'matches.claim', 'matches.quick', 'matches.searchPlayers');
if (q.get('matches') !== '0' && q.get('chat') !== '0') caps.push('matches.chat', 'matches.chatSend');
function send(msg) { frame.contentWindow.postMessage(msg, '*'); }
function init() {
  const open = Object.keys(matches)[Number(q.get('open')) - 1];
  send({ type: 'init', user: q.get('user') === '0' ? null : { ...ME, avatar: null, createdAt: null },
    sessionToken: 'x', expiresAt: null, colorScheme: q.get('theme') === 'dark' ? 'dark' : 'light', capabilities: caps,
    initialState: open ? { target: 'match', matchUuid: open } : undefined });
}
frame.addEventListener('load', () => { init(); setTimeout(init, 200); });

function start(m) {
  m.status = 'active'; m.turn = Math.floor(Math.random() * m.seats); m.turnStartedAt = turnStart();
  m.version++; m.updatedAt = new Date().toISOString();
  othersMove(m);
}

function handle(type, p) {
  const m = p.matchUuid && matches[p.matchUuid];
  switch (type) {
    case 'storage.get': return localStorage.getItem('cc-harness:' + p.key);
    case 'storage.set': localStorage.setItem('cc-harness:' + p.key, p.value); return null;
    case 'actions.showGameInfo': console.log('[harness] game info sheet', p && p.section); return null;
    case 'storage.delete': localStorage.removeItem('cc-harness:' + p.key); return null;
    case 'matches.list': return Object.values(matches).map((x) => { const v = view(x); delete v.view; delete v.joinCode; return v; });
    case 'matches.quick': {
      const mine = Object.values(matches).find((x) => x.matchmaking && x.status === 'lobby');
      if (mine) return view(mine);
      const lobby = newMatch([], { seats: 2 });
      lobby.matchmaking = true;
      setTimeout(() => {
        if (lobby.status !== 'lobby') return;
        lobby.players.push({ seat: 1, uuid: STRANGER.uuid, username: STRANGER.username, avatar: null, status: 'joined', score: 0 });
        start(lobby);
      }, Number(q.get('quickwait') || 4000));
      return view(lobby);
    }
    case 'matches.chat': {
      if (!m) throw { code: 'match/not-found', message: 'No such match.' };
      const limit = p.limit || 30;
      const end = p.before ? m.chat.findIndex((x) => x.messageUuid === p.before) : m.chat.length;
      const s = Math.max(0, end - limit);
      if (p.markSeen) m.chatSeen = m.chat.length;
      return { conversationUuid: m.chat.length ? m.uuid : null, messages: m.chat.slice(s, end), unread: m.chat.length - m.chatSeen, hasMore: s > 0 };
    }
    case 'matches.chatSend': {
      if (!m) throw { code: 'match/not-found', message: 'No such match.' };
      const text = String(p.text || '').trim();
      const again = p.nonce && m.chat.find((x) => x.nonce === p.nonce);
      if (again) return again;
      const msg = chatMessage(m, ME, text);
      msg.nonce = p.nonce || null;
      m.chatSeen = m.chat.length;
      const other = m.players.find((x) => x.uuid !== ME.uuid && x.status === 'joined');
      if (other && q.get('opp') !== 'none') setTimeout(() => chatMessage(m, other, REPLIES[Math.floor(Math.random() * REPLIES.length)]), 2500);
      return msg;
    }
    case 'matches.get': if (!m) throw { code: 'match/not-found', message: 'No such match.' }; return view(m);
    case 'matches.invitable': return PEOPLE;
    case 'matches.searchPlayers': {
      const qy = String(p.query || '').trim().toLowerCase();
      return [...PEOPLE, ...OTHERS].filter((x) => x.username.toLowerCase().startsWith(qy)).slice(0, p.limit || 20);
    }
    case 'matches.create': {
      if (p.game !== 'chinese-checkers' || p.maxPlayers < 2 || p.maxPlayers > 4) throw { code: 'match/invalid', message: 'chinese-checkers is played by 2 to 4 players.' };
      const asked = [...PEOPLE, ...OTHERS].filter((x) => (p.invitees || []).includes(x.uuid));
      const made = newMatch(asked, { seats: p.maxPlayers });
      made.status = 'lobby';
      made.players.forEach((pl) => { if (pl.uuid !== ME.uuid) pl.status = 'invited'; });
      if (p.open) made.joinCode = 'R4BB1T';
      setTimeout(() => {
        made.players.forEach((pl) => { if (pl.status === 'invited') pl.status = 'joined'; });
        made.version++;
        if (made.players.length === made.seats) start(made);
      }, Number(q.get('acceptms') || 4000));
      return view(made);
    }
    case 'matches.join': {
      if (!m) throw { code: 'match/not-found', message: 'No such match.' };
      if (m.status === 'lobby' && me(m) && me(m).status === 'invited') {
        me(m).status = 'joined';
        m.players.forEach((pl) => { pl.status = 'joined'; });
        start(m);
      }
      return view(m);
    }
    case 'matches.move': {
      if (!m) throw { code: 'match/not-found', message: 'No such match.' };
      const mine = me(m);
      if (!mine || m.turn !== mine.seat || m.status !== 'active') throw { code: 'match/not-your-turn', message: 'It is not your turn.' };
      if (p.version !== m.version) throw { code: 'match/version-conflict', message: 'The match has changed since you last looked.' };
      play(m, mine.seat, p.move || {});
      return view(m);
    }
    case 'matches.nudge': {
      const waited = Date.now() - new Date(m.turnStartedAt).getTime();
      if (waited < 86400e3) throw { code: 'match/too-soon', message: 'You can nudge in a few hours.' };
      return { nudgedAt: new Date().toISOString() };
    }
    case 'matches.claim': {
      const idle = m.turn;
      record(m, idle, { type: 'claim', claimedBy: me(m).seat });
      m.players.find((x) => x.seat === idle).status = 'forfeited';
      if (activeSeats(m).length < 2) { m.status = 'finished'; m.winner = me(m).seat; }
      else { m.turn = nextTurn(m, idle); othersMove(m); }
      return view(m);
    }
    case 'matches.resign': {
      if (m.status === 'lobby') { m.status = 'abandoned'; m.version++; m.updatedAt = new Date().toISOString(); return view(m); }
      const mine = me(m);
      mine.status = 'resigned'; m.version++;
      const left = activeSeats(m);
      if (left.length < 2) { m.status = 'finished'; m.winner = left[0]; }
      else if (m.turn === mine.seat) { m.turn = nextTurn(m, mine.seat); othersMove(m); }
      return view(m);
    }
  }
  return undefined;
}

window.addEventListener('message', (e) => {
  const r = e.data; if (!r || !r.correlationId) return;
  setTimeout(() => {
    try {
      send({ type: 'response', correlationId: r.correlationId, ok: true, result: handle(r.type, r.payload || {}) });
    } catch (err) {
      console.error(err);
      send({ type: 'response', correlationId: r.correlationId, ok: false, error: { code: err.code || 'bridge/error', message: err.message || String(err) } });
    }
  }, DELAY);
});
</script>
</body></html>
