<!doctype html><html><head><meta charset="utf-8"><title>Icon render</title>
<style>html,body{margin:0;background:#000}img{display:block}</style></head>
<!-- Renders icon/icon.svg at ?size=512 or 1024, for a headless-Chrome
     screenshot at that window size (README, "The icon"). -->
<body><img id="i" src="../icon/icon.svg">
<script>const s = Number(new URLSearchParams(location.search).get('size') || 512); i.width = s; i.height = s;</script>
</body></html>
